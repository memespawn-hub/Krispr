[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt4k"
version = "1.0.0"
description = "Free, self-hosted 4K/8K YouTube downloader with a web UI and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2026.8.19",
    "flask>=3.0",
]

[project.scripts]
yt4k = "yt4k.cli:main"
yt4k-web = "yt4k.web:main"

[tool.setuptools]
packages = ["yt4k"]

[tool.setuptools.package-data]
yt4k = ["templates/*.html"]
